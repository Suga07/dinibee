$kind: http-request
description: |-
  Update allowlisted non-secret platform setting.
  Required authority: hasAuthority('PLATFORM_SETTINGS_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/admin/settings/support.email"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "support@example.test",
      "reason": "Reviewed and authorized action"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
      }
    language: text/javascript
order: 12000
