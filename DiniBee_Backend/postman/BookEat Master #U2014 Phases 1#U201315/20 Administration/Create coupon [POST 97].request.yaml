$kind: http-request
description: |-
  Create coupon.
  Required authority: hasAuthority('COUPON_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/admin/coupons"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "SAVE10",
      "title": "Ten percent service offer",
      "restaurantId": "{{restaurantId}}",
      "serviceType": "RESTAURANT",
      "minimumAmount": 100,
      "discountPercent": 10,
      "maximumDiscount": 50,
      "maximumUses": 100,
      "effectiveFrom": "{{ruleFrom}}",
      "effectiveUntil": "{{ruleUntil}}",
      "active": true
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("promotionId", data.id);
        if (data.version !== undefined) pm.environment.set("promotionVersion", String(data.version));
      }
    language: text/javascript
order: 16000
