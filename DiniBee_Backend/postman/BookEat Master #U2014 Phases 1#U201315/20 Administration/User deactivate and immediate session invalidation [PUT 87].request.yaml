$kind: http-request
description: |-
  User deactivate and immediate session invalidation.
  Required authority: hasAuthority('USER_BLOCK').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/admin/users/{{adminUserId}}/deactivate"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{adminUserVersion}},
      "reason": "Reviewed and authorized action"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.user && data.user.id) pm.environment.set("adminUserId", data.user.id);
        if (data.version !== undefined) pm.environment.set("adminUserVersion", String(data.version));
      }
    language: text/javascript
order: 6000
