$kind: http-request
description: |-
  Audit and apply manual wallet adjustment.
  Required authority: hasAuthority('WALLET_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
  Reuse this saved intent key for an exact retry. Clear intent915_46 before a different business intent. Never auto-retry unknown gateway outcomes with a new key.
url: "{{baseUrl}}/admin/wallets/{{walletCustomerId}}/adjust"
method: POST
headers:
  Idempotency-Key: "{{intent915_46}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 10,
      "points": 0,
      "reason": "Approved service credit; enter the real case reference"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("intent915_46")) pm.environment.set("intent915_46", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("walletCustomerId", data.id);
        if (data.version !== undefined) pm.environment.set("walletCustomerVersion", String(data.version));
      }
    language: text/javascript
order: 5000
