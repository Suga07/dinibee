$kind: http-request
description: |-
  Load paged support conversation.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/customer/support/tickets/{{supportTicketId}}/messages?page=0&size=20"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("supportTicketId", data.id);
        if (data.version !== undefined) pm.environment.set("supportVersion", String(data.version));
      }
    language: text/javascript
order: 4000
