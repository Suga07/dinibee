$kind: http-request
description: |-
  Add scoped support message.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
  Reuse this saved intent key for an exact retry. Clear intent915_61 before a different business intent. Never auto-retry unknown gateway outcomes with a new key.
url: "{{baseUrl}}/customer/support/tickets/{{supportTicketId}}/messages"
method: POST
headers:
  Idempotency-Key: "{{intent915_61}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "message": "Additional information about this request."
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("intent915_61")) pm.environment.set("intent915_61", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("supportTicketId", data.id);
        if (data.version !== undefined) pm.environment.set("supportVersion", String(data.version));
      }
    language: text/javascript
order: 5000
