$kind: http-request
description: Use current restaurantVersion. Success responses update the saved version. Run this request only in its documented workflow state.
url: "{{baseUrl}}/admin/restaurants/{{restaurantId}}/documents/{{documentIdOWNER_ID}}/download"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Expected status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
