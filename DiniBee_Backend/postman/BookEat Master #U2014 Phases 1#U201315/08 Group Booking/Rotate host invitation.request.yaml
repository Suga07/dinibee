$kind: http-request
description: |-
  Requires group version. Returns token and deep-link QR payload; does not send a message. Previous token becomes invalid.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
url: "{{baseUrl}}/customer/group-bookings/{{groupBookingId}}/invite?version={{groupVersion}}"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.inviteCode)pm.environment.set("inviteCode",d.inviteCode);
      }
    language: text/javascript
order: 3000
