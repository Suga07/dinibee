$kind: http-request
description: |-
  Idempotency-Key required. Server revalidates approval, service, hours, capacity and allocation overlap in one transaction. Payment remains UNPAID.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
  Idempotency key is initialized once. Keep it for exact retries; clear it for a new booking/order intent.
url: "{{baseUrl}}/customer/reservations"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{reservationKey}}"
body:
  type: json
  content: |-
    {
      "restaurantId": "{{restaurantId}}",
      "tableId": "{{tableId}}",
      "startsAt": "{{startsAt}}",
      "guestCount": 2,
      "specialRequest": null
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("reservationKey")) pm.environment.set("reservationKey", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.id){pm.environment.set("reservationId",d.id);pm.environment.set("reservationVersion",d.version);}
      }
    language: text/javascript
order: 1000
