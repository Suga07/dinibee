$kind: http-request
description: |-
  Requires order version and reason; accepted kitchen work cannot be cancelled by the customer.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
url: "{{baseUrl}}/customer/orders/{{orderId}}/cancel"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{orderVersion}},
      "reason": "Requested action"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.id){pm.environment.set("orderId",d.id);pm.environment.set("orderVersion",d.version);}
      }
    language: text/javascript
order: 4000
