$kind: http-request
description: |-
  Redeem points to wallet exactly once.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
  Reuse this saved intent key for an exact retry. Clear intent915_42 before a different business intent. Never auto-retry unknown gateway outcomes with a new key.
url: "{{baseUrl}}/customer/rewards/redeem"
method: POST
headers:
  Idempotency-Key: "{{intent915_42}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "points": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("intent915_42")) pm.environment.set("intent915_42", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
      }
    language: text/javascript
order: 5000
