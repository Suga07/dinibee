$kind: http-request
description: |-
  Dining start.
  Required authority: hasRole('OWNER') and hasAuthority('DINING_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/dining-sessions/{{diningSessionId}}/start"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{diningVersion}},
      "reason": "Reviewed and authorized action"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("diningSessionId", data.id);
        if (data.version !== undefined) pm.environment.set("diningVersion", String(data.version));
      }
    language: text/javascript
order: 8000
