$kind: http-request
description: |-
  Mark own notification read.
  Required authority: hasAuthority('NOTIFICATION_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/admin/notifications/{{notificationId}}/read"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("notificationId", data.id);
        if (data.version !== undefined) pm.environment.set("notificationVersion", String(data.version));
      }
    language: text/javascript
order: 8000
