$kind: http-request
description: ""
url: "{{baseUrl}}/customer/profile"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status 200", function () { pm.response.to.have.status(200); });
      const result = pm.response.json();
      pm.test("Response envelope", function () { pm.expect(result).to.have.property("success"); });
    language: text/javascript
order: 1000
