$kind: http-request
name: "Owner: Replace owned restaurant cuisine tags"
description: |-
  Requires current restaurantVersion and at most 20 unique cuisine names.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/cuisines"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "restaurantVersion": {{restaurantVersion}},
      "cuisines": [
        "Indian"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.restaurantVersion!==undefined)pm.environment.set("restaurantVersion",d.restaurantVersion);
      }
    language: text/javascript
order: 12000
