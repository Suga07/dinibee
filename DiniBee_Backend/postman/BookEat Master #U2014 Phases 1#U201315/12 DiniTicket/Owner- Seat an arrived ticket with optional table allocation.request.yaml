$kind: http-request
name: "Owner: Seat an arrived ticket with optional table allocation"
description: |-
  Requires ticket version. If tableId is supplied, locks table and claims dining duration plus grace without overlap; sets operational status OCCUPIED until completion. Missing reservation settings use a 90-minute seating interval.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/dinitickets/{{diniTicketId}}/seat"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{ticketVersion}},
      "tableId": "{{tableId}}",
      "reason": "Party seated"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.id){pm.environment.set("diniTicketId",d.id);pm.environment.set("ticketVersion",d.version);}
      }
    language: text/javascript
order: 9000
