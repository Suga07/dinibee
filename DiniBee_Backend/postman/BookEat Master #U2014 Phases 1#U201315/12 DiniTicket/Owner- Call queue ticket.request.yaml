$kind: http-request
name: "Owner: Call queue ticket"
description: |-
  Requires current ticket version and reason. Calls respect FIFO; no-show waits until call deadline; completion releases table and requires food orders resolved.

  See docs/PHASE5_8_API.md for prerequisites. Refresh resource versions before each mutation. These requests are separate scenarios, not a single sequential collection run.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/dinitickets/{{diniTicketId}}/call"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{ticketVersion}},
      "reason": "Requested action"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful response", () => pm.expect(pm.response.code).to.be.within(200, 299));
      if (pm.response.code >= 200 && pm.response.code < 300) {
      const d = pm.response.json().data;
      if(d && d.id){pm.environment.set("diniTicketId",d.id);pm.environment.set("ticketVersion",d.version);}
      }
    language: text/javascript
order: 10000
