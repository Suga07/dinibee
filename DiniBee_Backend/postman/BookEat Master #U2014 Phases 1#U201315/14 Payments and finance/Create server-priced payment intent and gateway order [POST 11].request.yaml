$kind: http-request
description: |-
  Create server-priced payment intent and gateway order.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
  Reuse this saved intent key for an exact retry. Clear intent915_10 before a different business intent. Never auto-retry unknown gateway outcomes with a new key.
url: "{{baseUrl}}/customer/payments/create-order"
method: POST
headers:
  Idempotency-Key: "{{intent915_10}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "referenceType": "RESERVATION",
      "referenceId": "{{reservationId}}",
      "gateway": "ZOHO",
      "couponCode": null
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("intent915_10")) pm.environment.set("intent915_10", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("paymentId", data.id);
        if (data.version !== undefined) pm.environment.set("paymentVersion", String(data.version));
        if (data.checkout) {
          pm.environment.set("gatewaySessionId", data.checkout.paymentSessionId || "");
          pm.environment.set("zohoAccountId", data.checkout.accountId);
          pm.environment.set("zohoApiKey", data.checkout.apiKey);
        }
      }
    language: text/javascript
order: 1000
