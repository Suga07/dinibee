$kind: http-request
description: Customer recovery after a lost checkout callback; requires a locally attached Zoho session. Uses verified provider evidence. See docs/ZOHO_PAYMENTS.md.
url: "{{baseUrl}}/customer/payments/{{paymentId}}/refresh"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("paymentId", data.id);
        if (data.version !== undefined) pm.environment.set("paymentVersion", String(data.version));
      }
    language: text/javascript
order: 28000
