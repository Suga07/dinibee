$kind: http-request
name: Record settlement processing and external transfer reference [PUT 34]
description: |-
  Record settlement processing and external transfer reference.
  Required authority: hasAuthority('SETTLEMENT_MANAGE').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/admin/settlements/{{settlementId}}/status"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{settlementVersion}},
      "status": "PROCESSING",
      "settlementReference": null,
      "reason": "Reviewed and authorized action"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("settlementId", data.id);
        if (data.version !== undefined) pm.environment.set("settlementVersion", String(data.version));
      }
    language: text/javascript
order: 24000
