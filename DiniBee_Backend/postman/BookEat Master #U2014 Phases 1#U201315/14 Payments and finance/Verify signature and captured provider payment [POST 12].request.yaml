$kind: http-request
description: |-
  Verify signature and captured provider payment.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/customer/payments/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "{{paymentId}}",
      "gatewayPaymentId": "{{gatewayPaymentId}}",
      "signature": "{{paymentSignature}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
      }
    language: text/javascript
order: 2000
