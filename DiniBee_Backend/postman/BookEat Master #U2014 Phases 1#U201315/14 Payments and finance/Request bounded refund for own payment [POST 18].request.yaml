$kind: http-request
description: |-
  Request bounded refund for own payment.
  Required authority: hasRole('CUSTOMER').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
  Reuse this saved intent key for an exact retry. Clear intent915_17 before a different business intent. Never auto-retry unknown gateway outcomes with a new key.
url: "{{baseUrl}}/customer/refunds"
method: POST
headers:
  Idempotency-Key: "{{intent915_17}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "{{paymentId}}",
      "amount": 10,
      "reason": "Requested refund after reviewing the completed service"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: if (!pm.environment.get("intent915_17")) pm.environment.set("intent915_17", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
        if (data.id) pm.environment.set("refundId", data.id);
        if (data.version !== undefined) pm.environment.set("refundVersion", String(data.version));
      }
    language: text/javascript
order: 8000
