$kind: http-request
description: |-
  Load bounded, scoped report with date filters.
  Required authority: hasRole('OWNER') and hasAuthority('OWNER_REPORT_VIEW').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/reports/{{reportType}}?fromDate={{reportFrom}}&toDate={{reportUntil}}&page=0&size=20"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const result = pm.response.json();
        pm.test("Success envelope", () => pm.expect(result.success).to.eql(true));
        const data = result.data || {};
      }
    language: text/javascript
order: 4000
