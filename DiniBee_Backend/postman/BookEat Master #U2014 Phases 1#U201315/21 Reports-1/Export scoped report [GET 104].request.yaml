$kind: http-request
description: |-
  Export scoped report.
  Required authority: hasRole('OWNER') and hasAuthority('OWNER_REPORT_VIEW').
  See docs/PHASE9_15_API.md. Populate IDs from real responses; reload the affected version before a new write. Dates are examples and must match your test clock.
url: "{{baseUrl}}/owner/restaurants/{{restaurantId}}/reports/{{reportType}}/export/{{reportFormat}}?fromDate={{reportFrom}}&toDate={{reportUntil}}&page=0&size=20"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
order: 5000
