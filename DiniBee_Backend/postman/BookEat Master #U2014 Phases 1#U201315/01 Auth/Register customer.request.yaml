$kind: http-request
description: ""
url: "{{baseUrl}}/auth/register/customer"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Test",
      "lastName": "Customer",
      "email": "{{customerEmail}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status 201", function () { pm.response.to.have.status(201); });
      const result = pm.response.json();
      pm.test("Response envelope", function () { pm.expect(result).to.have.property("success"); });
      if (result.success && result.data) {
        pm.environment.set("customerToken", result.data.accessToken);
        pm.environment.set("customerRefreshToken", result.data.refreshToken);
        pm.environment.set("customerUserId", result.data.user.id);
      }
    language: text/javascript
order: 2000
