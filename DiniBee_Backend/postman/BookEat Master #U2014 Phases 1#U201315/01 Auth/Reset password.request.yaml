$kind: http-request
description: Read challenge/token from the email. Revokes all sessions; update password variable and sign in again.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "challengeId": "{{resetChallengeId}}",
      "token": "{{resetToken}}",
      "newPassword": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status 200", function () { pm.response.to.have.status(200); });
      const result = pm.response.json();
      pm.test("Response envelope", function () { pm.expect(result).to.have.property("success"); });
    language: text/javascript
order: 12000
