$kind: http-request
description: Revokes all sessions. Run separately from the normal read flow.
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{newPassword}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status 200", function () { pm.response.to.have.status(200); });
      const result = pm.response.json();
      pm.test("Response envelope", function () { pm.expect(result).to.have.property("success"); });
    language: text/javascript
order: 13000
