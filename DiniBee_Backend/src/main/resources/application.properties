spring.application.name=dinibee-backend
# Select dev/prod explicitly. No development profile is enabled by default.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dinibee}
spring.datasource.username=${DB_USERNAME:dinibee_user}
spring.datasource.password=${DB_PASSWORD:}


# ===============================
# HIKARI CONNECTION POOL
# ===============================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000

# Limit per-session query sort/hash memory to prevent PostgreSQL OOM on low-RAM machines.
# Each connection gets its own work_mem budget; 5 connections x 1MB = 5MB max sort memory.
spring.datasource.hikari.connection-init-sql=SET work_mem = '1MB'
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
# TEMPORARY compatibility for existing local DBs where V46 was already applied with an older checksum.
# V47 contains the forward-only table-status update. After running Flyway repair, set this back to true.
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
app.docs-public=false
# CORS
#app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:50375,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:62918/,http://127.0.0.1:3000,http://127.0.0.1:50375}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
#app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS=https://admin.dinibee.com,https://owner.dinibee.com}

# Authentication
app.auth.issuer=${JWT_ISSUER:dinibee-api}
app.auth.audience=${JWT_AUDIENCE:dinibee-clients}

# Secrets are supplied by the runtime environment in every profile.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-pepper=${AUTH_TOKEN_PEPPER:}

app.auth.access-ttl=PT15M
app.auth.refresh-ttl=P30D
app.auth.otp-ttl=PT10M
app.auth.reset-ttl=PT15M
app.auth.max-challenge-attempts=5
app.mail.encryption-key=${MAIL_ENCRYPTION_KEY:}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@bookeat.local}
app.mail.poll-delay-ms=5000
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# admin panel hard code

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
logging.level.root=INFO
logging.level.com.bookeat=INFO

# Phase 3: settlement credentials are independent of authentication and mail keys.
# Omission preserves Phase 1/2 startup; settlement writes return 503 until configured.
app.settlement.encryption-key=${SETTLEMENT_ENCRYPTION_KEY:}
app.onboarding.required-documents=${ONBOARDING_REQUIRED_DOCUMENTS:}
app.storage.provider=${DOCUMENT_STORAGE_PROVIDER:LOCAL}
app.storage.local-root=${DOCUMENT_STORAGE_LOCAL_ROOT:${user.home}/.dinibee/private-documents}
app.storage.s3.enabled=${DOCUMENT_STORAGE_S3_ENABLED:true}
app.storage.s3.bucket=${DOCUMENT_STORAGE_S3_BUCKET:}
app.storage.s3.region=${DOCUMENT_STORAGE_S3_REGION:ap-south-1}

# Phase 10: disabled until complete provider configuration is supplied.

# Razorpay (keep secrets in environment variables; never in Flutter)
# v25 fix: when both RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are supplied, the gateway auto-enables.
# RAZORPAY_PAYMENTS_ENABLED=true remains supported but is no longer required when both keys exist.
app.payments.razorpay.enabled=${RAZORPAY_PAYMENTS_ENABLED:true}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payments.razorpay.webhook-enabled=${RAZORPAY_WEBHOOK_ENABLED:true}

