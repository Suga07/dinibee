# Production requires explicit DB, mail and HTTPS origin configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dinibee}
spring.datasource.username=${DB_USERNAME:dinibee_user}
spring.datasource.password=${DB_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.docs-public=false
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.datasource.hikari.minimum-idle=2
