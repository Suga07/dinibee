spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dinibee}
spring.datasource.username=${DB_USERNAME:dinibee_user}
spring.datasource.password=${DB_PASSWORD:}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.docs-public=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# SQL values, credentials, OTPs and bearer tokens are not logged even in dev.
